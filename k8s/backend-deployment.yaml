apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ecommerce-backend

  template:
    metadata:
      labels:
        app: ecommerce-backend

    spec:
      containers:
      - name: ecommerce-backend
        image: gopal82/ecommerce-backend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5050

        envFrom:
        - configMapRef:
            name: ecommerce-config

        - secretRef:
            name: ecommerce-secret